    <h1 class="title">我们不做预报App：节点清单能帮什么、不能帮什么</h1>
    <div class="warn"><strong>红线写在最前：</strong>不做天气预报App、不对外发预警、不卖气象传感器/硬件。</div>
    <p class="p">有人原话：「别整成预报App。」也有人说：「一张表记下霜冻大风连阴雨可以，别一上来卖测风仪。」</p>
    <p class="p"><strong>能帮你的</strong>：提醒关键农事节点、记简易观测、一页纸人话、家属也能勾。</p>
    <p class="p"><strong>不能帮你的</strong>：不另做预报、不保证产量、不绑硬件链接。</p>
    <p class="p">红线清楚，你再决定要不要试填。</p>
